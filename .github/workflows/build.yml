# NOCTURNE — CI
# 内核测试 + 产物构建 + Pages 发布

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Kernel + wiring tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify kernel invariants and build contracts
        run: node --test test/kernel.test.js test/wiring.test.js

  build:
    name: Build bundle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Prefetch embedding weights
        # 权重不进 git（23 MB 二进制），构建时取一份随产物发布，
        # 这样 Pages 上的站点完全不依赖外部网络。
        run: |
          set -euo pipefail
          BASE="https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main"
          DEST="public/models/Xenova/all-MiniLM-L6-v2"
          mkdir -p "$DEST/onnx"
          for f in config.json tokenizer.json tokenizer_config.json; do
            curl -fsSL --retry 3 --max-time 120 -o "$DEST/$f" "$BASE/$f"
          done
          curl -fsSL --retry 3 --max-time 300 \
            -o "$DEST/onnx/model_quantized.onnx" "$BASE/onnx/model_quantized.onnx"
          ls -lh "$DEST" "$DEST/onnx"
      - run: npm run build
        env:
          # 项目站点挂在 /<repo>/ 下，资源根路径必须带前缀，否则线上 404 白屏
          NOCTURNE_PUBLIC_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
